<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neumorphic Calculator</title>
  
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            lilac: {
              50: '#faf5ff',
              100: '#f3e8ff',
              200: '#eedbf7',
              300: '#e5c4f2',
            },
            softBg: '#f0f3f8',
            softSurface: '#f5f7fb',
            accentPink: '#e8a5b8',
            accentPinkHover: '#df94a9',
            accentPinkActive: '#d4839a',
          }
        }
      }
    }
  </script>

  <!-- Custom CSS for Neumorphic Physics & tactile feel -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-gradient-to-br from-[#eedbf7] via-[#f5e6fc] to-[#fdeef5] min-h-screen w-full flex items-center justify-center p-2 sm:p-4 md:p-6 overflow-hidden select-none font-sans text-slate-700 antialiased">

  <!-- Ambient Decorative Glows -->
  <div class="fixed top-[-10%] left-[-10%] w-[45vw] h-[45vw] rounded-full bg-purple-200/40 blur-[120px] pointer-events-none -z-10"></div>
  <div class="fixed bottom-[-10%] right-[-10%] w-[45vw] h-[45vw] rounded-full bg-pink-200/40 blur-[120px] pointer-events-none -z-10"></div>

  <!-- Main Calculator Shell (Almost fills viewport height & width) -->
  <main class="calculator-shell relative w-full max-w-[540px] h-[95vh] max-h-[920px] min-h-[580px] bg-[#f4f6fa] rounded-[2.5rem] sm:rounded-[3rem] p-5 sm:p-7 md:p-8 flex flex-col justify-between shadow-neu-outer transition-all duration-300">
    
    <!-- Top Utility Bar: Header, Haptic/Sound & History Toggles -->
    <header class="flex items-center justify-between px-2 pb-2 pt-1">
      <div class="flex items-center space-x-2">
        <span class="inline-block w-3 h-3 rounded-full bg-pink-400 shadow-[0_0_8px_rgba(232,165,184,0.8)]"></span>
        <span class="text-xs font-bold tracking-widest text-slate-400 uppercase">CALC</span>
      </div>

      <div class="flex items-center gap-2">
        <!-- Expand / Size Mode Toggle -->
        <button id="sizeToggle" type="button" aria-label="Toggle calculator size" title="Perbesar / Perkecil Ukuran"
          class="neu-icon-btn p-2.5 rounded-full text-slate-500 hover:text-slate-700 transition-colors">
          <svg id="sizeExpandIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
          </svg>
          <svg id="sizeShrinkIcon" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 9L4 4m0 0v4m0-4h4m6 5l5-5m0 0v4m0-4h-4M9 15l-5 5m0 0v-4m0 4h4m11-5l-5 5m5 0v-4m0 4h-4" />
          </svg>
        </button>

        <!-- Sound Effect Toggle -->
        <button id="soundToggle" type="button" aria-label="Toggle sound effects" title="Suara Sentuhan (Aktif/Nonaktif)"
          class="neu-icon-btn p-2.5 rounded-full text-slate-500 hover:text-slate-700 transition-colors">
          <svg id="soundIconOn" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
          </svg>
          <svg id="soundIconOff" class="w-4 h-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
          </svg>
        </button>

        <!-- History Drawer Button -->
        <button id="historyToggle" type="button" aria-label="Toggle history" title="Riwayat Perhitungan"
          class="neu-icon-btn p-2.5 rounded-full text-slate-500 hover:text-slate-700 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Inset Display Screen -->
    <section class="display-container relative my-3 sm:my-4 bg-[#ebedf3] rounded-[1.75rem] sm:rounded-[2rem] p-5 sm:p-6 shadow-neu-inset flex flex-col justify-end text-right min-h-[120px] sm:min-h-[145px] transition-all overflow-hidden" aria-live="polite">
      
      <!-- Expression / Calculation formula -->
      <div id="expressionDisplay" class="text-xs sm:text-sm font-medium font-mono text-slate-400 min-h-[1.5rem] tracking-wider truncate mb-1" title="Formula"></div>

      <!-- Main Result Display -->
      <div class="relative flex items-center justify-end w-full overflow-hidden">
        <span id="mainDisplay" class="font-sans font-semibold text-slate-700 tracking-tight leading-none text-4xl sm:text-5xl md:text-6xl transition-all duration-150 inline-block break-all">0</span>
      </div>

      <!-- Floating Quick Copy Button (appears when hovering or tapping display) -->
      <button id="copyBtn" type="button" title="Salin Hasil"
        class="absolute top-3 left-4 text-[11px] font-medium tracking-wide text-slate-400 hover:text-slate-700 bg-slate-200/60 hover:bg-slate-300/60 px-2.5 py-1 rounded-full opacity-60 hover:opacity-100 transition-all flex items-center gap-1">
        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2" />
        </svg>
        <span>Salin</span>
      </button>

      <!-- Toast Feedback Popup -->
      <div id="copyToast" class="absolute top-3 left-1/2 -translate-x-1/2 bg-slate-800 text-white text-[11px] font-medium px-3 py-1 rounded-full pointer-events-none opacity-0 transition-opacity duration-200 shadow-md">
        Tersalin ke clipboard!
      </div>
    </section>

    <!-- Keypad Matrix (5 Rows x 4 Columns) -->
    <!-- Matches visual structure of the reference photo precisely -->
    <div class="grid grid-cols-4 grid-rows-5 gap-3 sm:gap-4 md:gap-5 flex-1 items-stretch py-2">
      
      <!-- Row 1: clr, DEL, %, / -->
      <button type="button" data-action="clear" class="neu-btn neu-btn-circle font-semibold text-base sm:text-lg text-slate-600">
        clr
      </button>
      <button type="button" data-action="delete" class="neu-btn neu-btn-circle font-semibold text-base sm:text-lg text-slate-600">
        DEL
      </button>
      <button type="button" data-action="percent" class="neu-btn neu-btn-circle font-medium text-base sm:text-lg text-slate-600">
        %
      </button>
      <button type="button" data-action="operator" data-val="/" class="neu-btn neu-btn-circle font-medium text-lg sm:text-xl text-slate-600">
        /
      </button>

      <!-- Row 2: 7, 8, 9, * -->
      <button type="button" data-action="number" data-val="7" class="neu-btn neu-btn-circle font-medium text-xl sm:text-2xl text-slate-700">
        7
      </button>
      <button type="button" data-action="number" data-val="8" class="neu-btn neu-btn-circle font-medium text-xl sm:text-2xl text-slate-700">
        8
      </button>
      <button type="button" data-action="number" data-val="9" class="neu-btn neu-btn-circle font-medium text-xl sm:text-2xl text-slate-700">
        9
      </button>
      <button type="button" data-action="operator" data-val="*" class="neu-btn neu-btn-circle font-medium text-lg sm:text-xl text-slate-600">
        *
      </button>

      <!-- Row 3: 4, 5, 6, - -->
      <button type="button" data-action="number" data-val="4" class="neu-btn neu-btn-circle font-medium text-xl sm:text-2xl text-slate-700">
        4
      </button>
      <button type="button" data-action="number" data-val="5" class="neu-btn neu-btn-circle font-medium text-xl sm:text-2xl text-slate-700">
        5
      </button>
      <button type="button" data-action="number" data-val="6" class="neu-btn neu-btn-circle font-medium text-xl sm:text-2xl text-slate-700">
        6
      </button>
      <button type="button" data-action="operator" data-val="-" class="neu-btn neu-btn-circle font-medium text-xl sm:text-2xl text-slate-600">
        -
      </button>

      <!-- Row 4: 1, 2, 3, + -->
      <button type="button" data-action="number" data-val="1" class="neu-btn neu-btn-circle font-medium text-xl sm:text-2xl text-slate-700">
        1
      </button>
      <button type="button" data-action="number" data-val="2" class="neu-btn neu-btn-circle font-medium text-xl sm:text-2xl text-slate-700">
        2
      </button>
      <button type="button" data-action="number" data-val="3" class="neu-btn neu-btn-circle font-medium text-xl sm:text-2xl text-slate-700">
        3
      </button>
      <button type="button" data-action="operator" data-val="+" class="neu-btn neu-btn-circle font-medium text-xl sm:text-2xl text-slate-600">
        +
      </button>

      <!-- Row 5: ., 0, = (spans 2 columns, rose pink) -->
      <button type="button" data-action="decimal" class="neu-btn neu-btn-circle font-bold text-xl sm:text-2xl text-slate-700 pb-1">
        .
      </button>
      <button type="button" data-action="number" data-val="0" class="neu-btn neu-btn-circle font-medium text-xl sm:text-2xl text-slate-700">
        0
      </button>
      <button type="button" data-action="calculate" class="neu-btn neu-btn-equals col-span-2 font-bold text-2xl sm:text-3xl text-slate-700">
        =
      </button>

    </div>

    <!-- Interactive History Drawer (Slides down over or within shell) -->
    <div id="historyDrawer" class="absolute inset-x-4 top-16 bottom-6 bg-[#f4f6fa]/95 backdrop-blur-md rounded-[2rem] p-5 shadow-2xl flex flex-col z-20 translate-y-4 opacity-0 pointer-events-none transition-all duration-300">
      <div class="flex items-center justify-between pb-3 border-b border-slate-200">
        <h3 class="font-bold text-slate-700 text-sm tracking-wide">Riwayat Perhitungan</h3>
        <div class="flex items-center gap-2">
          <button id="clearHistoryBtn" type="button" class="text-xs text-rose-500 hover:text-rose-600 font-medium px-2 py-1 rounded">
            Hapus Semua
          </button>
          <button id="closeHistoryBtn" type="button" class="text-slate-400 hover:text-slate-600 p-1">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
      </div>
      <div id="historyList" class="flex-1 overflow-y-auto py-3 space-y-2.5 font-mono text-sm">
        <p class="text-slate-400 text-center py-8 text-xs font-sans">Belum ada riwayat kalkulasi.</p>
      </div>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
